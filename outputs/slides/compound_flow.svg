<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="330" viewBox="0 0 1720 330" font-family="'Helvetica Neue', 'Apple SD Gothic Neo', sans-serif"><rect width="1720" height="330" fill="#000000"/><rect x="20" y="60" width="360" height="170" rx="18" fill="none" stroke="#ffffff" stroke-width="4"/><text x="200.0" y="134.0" font-size="36" fill="#ffffff" text-anchor="middle" font-weight="800">① 도착</text><text x="200.0" y="184.0" font-size="26" fill="#c3c2b7" text-anchor="middle" font-weight="500">여러 목적지 화물 적재</text><line x1="392" y1="145.0" x2="438" y2="145.0" stroke="#ffffff" stroke-width="4"/><path d="M444,145.0 l-18,-12 v24 z" fill="#ffffff"/><rect x="456" y="60" width="360" height="170" rx="18" fill="none" stroke="#ffffff" stroke-width="4"/><text x="636.0" y="134.0" font-size="36" fill="#ffffff" text-anchor="middle" font-weight="800">② 부분 하역</text><text x="636.0" y="184.0" font-size="26" fill="#c3c2b7" text-anchor="middle" font-weight="500">유지 목적지 d 외 화물만</text><line x1="828" y1="145.0" x2="874" y2="145.0" stroke="#ffffff" stroke-width="4"/><path d="M880,145.0 l-18,-12 v24 z" fill="#ffffff"/><rect x="892" y="60" width="360" height="170" rx="18" fill="none" stroke="#ffffff" stroke-width="4"/><text x="1072.0" y="134.0" font-size="36" fill="#ffffff" text-anchor="middle" font-weight="800">③ 이송 화물 대기</text><text x="1072.0" y="184.0" font-size="26" fill="#c3c2b7" text-anchor="middle" font-weight="500">다른 트럭이 내린 d행 화물</text><line x1="1264" y1="145.0" x2="1310" y2="145.0" stroke="#ffffff" stroke-width="4"/><path d="M1316,145.0 l-18,-12 v24 z" fill="#ffffff"/><rect x="1328" y="60" width="360" height="170" rx="18" fill="none" stroke="#3987e5" stroke-width="4"/><text x="1508.0" y="134.0" font-size="36" fill="#ffffff" text-anchor="middle" font-weight="800">④ 출고 전환</text><text x="1508.0" y="184.0" font-size="26" fill="#c3c2b7" text-anchor="middle" font-weight="500">d의 운송 트럭으로 출발</text><text x="860.0" y="302.0" font-size="30" fill="#c3c2b7" text-anchor="middle" font-weight=